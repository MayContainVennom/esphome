substitutions:
  devicename: waveshare_1
  friendname: waveshare_1
  timez: Europe/London
  board: esp32-s3-devkitc-1
  screenstart: ALWAYS_ON
  screensaver: 5 min
  repin: GPIO14
  dcpin: GPIO8
  bkpin: GPIO2
  clpin: GPIO10
  mopin: GPIO11
  mipin: GPIO12
  cspin: GPIO09
  sdapin: GPIO6
  sclpin: GPIO7
  intpin: GPIO5  
  rstpin: GPIO13

esphome:
  name: $devicename
  friendly_name: $friendname

esp32:
  board: $board
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "aFnY1qXaJIL9pfCYX/ohowAJDUJMhIo4Sgu5YzooEvY="

ota:
  - platform: esphome
    password: password

wifi:
  ssid: !secret iot_ssid
  password: !secret iot_password

  ap:
    ssid: "Round-Touchscreen"
    password: password

  use_address: 10.0.30.244
captive_portal:

binary_sensor:
  - platform: homeassistant
    id: remote_lightCeilingGroup
    entity_id: light.ceiling_group
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_ceilingGroup
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: remote_lightBedLeft
    entity_id: light.lamp_nc
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_bedLeft
          state:
            checked: !lambda return x;
