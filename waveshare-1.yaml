    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_deskGroup
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: remote_lightDeskLeft
    entity_id: light.left
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_deskLeft
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: remote_lightDeskRight
    entity_id: light.Right
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_deskRight
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: remote_lightTV
    entity_id: light.hue_gradient_lightstrip_1
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_TV
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: remote_lightSkadie
    entity_id: light.light_strip
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_skadis
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: remote_fan
    entity_id: fan.sonoff_1000cc2152
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: fan_toggle
          state:
            checked: !lambda return x;

sensor:
  - platform: homeassistant
    id: room_thermostat
    entity_id: sensor.bedroom_bedroom_temperature
    on_value:
      - lvgl.label.update:
          id: screen_temp
          text:
            format: "%.1f°C"
            args: ['x']
      - lvgl.label.update:
          id: mainMenu_temp
          text:
            format: "%.1f°C"
            args: ['x']

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
  - platform: homeassistant
    id: room_thermostat_text
    entity_id: sensor.temperature_44

spi:
  mosi_pin: $mopin
  clk_pin: $clpin
  miso_pin: $mipin

i2c:
  sda: $sdapin
  scl: $sclpin
  id: i2c_touch

output:
  - platform: ledc
    pin: $bkpin
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# UPDATED: Changed platform from cst816 to cst820
touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_touch
    interrupt_pin: $intpin
    reset_pin: $rstpin
    on_touch:
      - lambda: |-
          ESP_LOGI("touch",
              "x=%d, y=%d, x_raw=%d, y_raw=%d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
          );

lvgl:
  touchscreens: my_touchscreen
  bg_color: 0
  align: center
  color_depth: 16
  on_idle:
    - timeout: 30s
      then:
      - lvgl.page.show: screensaver
    - timeout: 300s
      then:
        - light.turn_off: back_light

  style_definitions:
    - id: temp_style
      text_font: montserrat_48
      align: center
      text_color: 0xFF0000
      radius: 4
      pad_all: 2  
  pages:
    - id: screensaver
      skip: true
      widgets:
        - label:
            id: screen_temp
            styles: temp_style
            align: center
      on_click:
        - lvgl.page.show: main_menu
        - light.turn_on: back_light
