display:
  - platform: ili9xxx
    model: GC9A01A
    dc_pin: $dcpin
    reset_pin: $repin
    cs_pin: $cspin
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    id: main_display
    dimensions: 
      height: 240
      width: 240
    rotation: 0
    color_order: BGR
